const stage=document.getElementById('stage'),holder=document.getElementById('holder'),doors=[...document.querySelectorAll('.door')];function fit(){let scale=Math.min(innerWidth/1672,1);stage.style.transform=`scale(${scale})`;holder.style.height=(941*scale)+'px'}addEventListener('resize',fit);fit();function closePlant(){document.getElementById('plant-note').classList.remove('show')}function closeAll(){doors.forEach(d=>{d.classList.remove('open');d.setAttribute('aria-expanded','false')})}doors.forEach(d=>{function toggle(){closePlant();let was=d.classList.contains('open');closeAll();if(!was){d.classList.add('open');d.setAttribute('aria-expanded','true')}}d.addEventListener('click',toggle);d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});document.getElementById('reset').onclick=()=>{closeAll();closePlant()};
